version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: kids_ecommerce_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: kids_ecommerce
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: kids_ecommerce_backend
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: mongodb://mongodb:27017/kids_ecommerce
      JWT_SECRET: super-secret-jwt-key-kids-fashion
      FRONTEND_URL: http://localhost:3000
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
    container_name: kids_ecommerce_frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    depends_on:
      - backend

volumes:
  mongodb_data:
